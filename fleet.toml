# Fleet configuration — cooldown overrides
# These entries ensure cooldowns survive scheduler restarts.
# All other projects run from their API-set values (no fleet override).
#
# ── STATIC cooldown-override mirror — NOT the live fleet config ─────────────
# This repo file is a curated SUBSET of operator pins (cooldowns that must
# survive daemon restarts). The LIVE fleet file is ~/.hermes/fleet.toml on the
# scheduler host, written ONLY by ~/.hermes/scripts/fleet-cooldown-policy.py;
# it covers the full fleet (~90+ entries) and changes constantly. The two
# files have different purposes and will never be identical — do NOT copy the
# live file into this repo (it would be stale again immediately).

[[projects]]
name = "uhlp"
repo_url = "local:/home/kara/uhlp"
workdir = "/home/kara/uhlp"
weight = 15
priority = 9
cooldown_s = 900
model = "deepseek-v4-flash"
provider = "deepseek-foreman"
namespace_id = "coding-hermes"
deliver = "telegram:-1003310984808:92897"
enabled = true

# chimera-v2 — feature-complete, all 6 dogfood P0/P1/P2 items closed at tick #75.
# Foreman self-pause: 0 pending tasks -> CooldownS=7200 (Bane 07-31 policy, NOT 43200).
# Pin in BOTH fleet.toml files so daemon restarts and fleet-auto-heal rule 3
