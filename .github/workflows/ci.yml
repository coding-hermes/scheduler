name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build
        run: go build ./...

      - name: Board vocabulary gate
        # SCHED-GAP-164: every JSONL board row must carry a dispatchable status.
        # Only status=="pending" rows are picked by the foreman, so a row minted
        # as e.g. "todo" parks real work nobody dispatches. Read-only check;
        # exits 1 on an off-vocabulary row. Skipped when the board is not in the
        # checkout (e.g. a fork PR that omits .coding-hermes/).
        if: hashFiles('.coding-hermes/board/tasks.jsonl') != ''
        run: python3 ops/check-fleet-invariants.py --board .coding-hermes/board/tasks.jsonl --board-only

      - name: Build binaries
        run: make build

      - name: End-to-end scheduler verify
        run: ./bin/schedulerd --test-verify 3

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -count=1 -short ./...

      - name: Test (full)
        run: go test -count=1 ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest
          args: --timeout=5m
