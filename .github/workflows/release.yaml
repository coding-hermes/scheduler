name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Version authority (CHANGELOG names the tag) — RELEASE-006
        # Fails fast and cheap, BEFORE the ~minutes-long multi-platform
        # build: a tag pushed over a tree whose CHANGELOG still says
        # [Unreleased] must fail the release here. The binary version smoke
        # below validates the ARTIFACT; this validates the TREE. The rule
        # itself is release-prep.sh's --check assertion (one implementation,
        # two callers); the wrapper runs it against a fixture copy so the
        # operator-checkout preconditions (clean tree, HEAD == origin/main,
        # tag-free) that a CI checkout cannot satisfy are eliminated by
        # construction.
        run: scripts/check-version-authority.sh "${GITHUB_REF#refs/tags/}"

      - name: Build all platforms
        # RELEASE-037: build output lives OUTSIDE the checkout, in
        # $RUNNER_TEMP/dist. Go's VCS stamping inspects the working tree, so a
        # dist/ inside the repo makes every build after the first observe the
        # earlier binaries as untracked files and stamp `vcs.modified=true` /
        # `<version>+dirty`; v1.14.0 shipped 7 of 8 dirty assets that way.
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          COMMIT="$(git rev-parse --short HEAD)"
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          LDFLAGS="-s -w -X github.com/coding-hermes/scheduler/internal/version.Version=${VERSION} -X github.com/coding-hermes/scheduler/internal/version.Commit=${COMMIT} -X github.com/coding-hermes/scheduler/internal/version.BuildDate=${BUILD_DATE}"
          DIST="${RUNNER_TEMP}/dist"
          mkdir -p "${DIST}"
          for os in linux darwin; do
            for arch in amd64 arm64; do
              echo "Building $os/$arch..."
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch \
                go build -ldflags="${LDFLAGS}" \
                -o "${DIST}/schedulerd-${os}-${arch}" ./cmd/schedulerd/
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch \
                go build -ldflags="${LDFLAGS}" \
                -o "${DIST}/migrate-${os}-${arch}" ./cmd/migrate/
            done
          done
          ls -lh "${DIST}/"
          # Version smoke (KB-GAP-040 class): the released binary must report
          # the tag — a silent -X no-op fails the release here, not in the field.
          "${DIST}/schedulerd-linux-amd64" --version | grep -q "schedulerd ${VERSION} " || { echo "version smoke FAILED"; exit 1; }
          "${DIST}/migrate-linux-amd64" --version | grep -q "migrate ${VERSION} " || { echo "migrate version smoke FAILED"; exit 1; }

      - name: Checkout must stay pristine during the build (RELEASE-037)
        # The other half of the stamp fix: if a future edit moves output back
        # into the tree, the VCS stamps regress to +dirty. Catch it here, at
        # the source, before the stamp gate reports the symptom.
        run: |
          status="$(git status --porcelain)"
          if [ -n "$status" ]; then
            printf '%s\n' "$status"
            echo "release build wrote into the checkout; VCS stamps would go +dirty"
            exit 1
          fi
          echo "clean: build output did not land in tracked paths"

      - name: VCS stamp gate — all 8 assets must be vcs.modified=false (RELEASE-037)
        run: bash scripts/check-release-vcs-stamps.sh "${RUNNER_TEMP}/dist"

      - name: Checksums
        run: cd "${RUNNER_TEMP}/dist" && sha256sum ./* > SHA256SUMS

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.temp }}/dist/*
          generate_release_notes: true
