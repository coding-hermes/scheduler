# schedulerd.toml — Example Configuration
# =============================================================================
# Copy this file to /etc/schedulerd.toml and start the daemon with:
#   schedulerd --config /etc/schedulerd.toml
#
# Resolution order (lowest → highest):
#   1. Hardcoded defaults
#   2. This TOML file
#   3. SCHEDULER_* environment variables
#   4. CLI flags (always win)
#
# NOTE (DOGFOOD-012): the resolution order above is the FEAT-005 target, not
# today's reality. The daemon currently reads only the [[projects]] /
# [[namespaces]] fleet sections and a few [scheduler] fields from a file
# passed via --config; the [daemon] / [gateway] / [duckbrain] root sections
# below are NOT loaded until FEAT-005 wires LoadConfig into daemon boot.
# =============================================================================

# ── Daemon ───────────────────────────────────────────────────────────────────
[daemon]
# Path to SQLite database file (~ and $HOME expanded at runtime)
db_path = "~/.hermes/coding-hermes/scheduler.db"
# HTTP listen address for dashboard, API, and MCP server
listen = "127.0.0.1:9090"

# ── Scheduler ────────────────────────────────────────────────────────────────
[scheduler]
# Fastest allowed tick interval (Go time.ParseDuration syntax)
min_interval = "20m"
# Slowest allowed tick interval
max_interval = "24h"
# Number of priority levels (1 = slowest, 10 = fastest). Must be >= 1.
num_levels = 10
# Total weight budget per evaluation cycle. Must be >= 1.
weight_budget = 100
# Maximum concurrent foreman ticks. Must be >= 1.
max_concurrent = 12
# Maximum wall-clock duration for a single tick before kill (2h = 2 hours)
tick_timeout = "2h"
# Enable multi-namespace scheduling (reserved/hard_cap per namespace)
namespace_mode = true

# ── Gateway ──────────────────────────────────────────────────────────────────
[gateway]
# Hermes gateway HTTP API URL. Empty string falls back to exec.Command.
# Supports ${VAR} env-var interpolation (e.g. ${API_SERVER_KEY}).
url = "http://127.0.0.1:8642"
# API key for Hermes gateway. Supports ${VAR} interpolation.
# Leave empty if using exec.Command spawn (no gateway).
key = "${API_SERVER_KEY}"
# Path to Hermes foreman home directory (~ and $HOME expanded at runtime)
foreman_home = "~/.hermes/foreman"

# ── DuckBrain ────────────────────────────────────────────────────────────────
[duckbrain]
# DuckBrain memory namespace for fleet context sync
namespace = "coding-hermes"
# DuckBrain HTTP server URL
url = "http://localhost:3000"

# ── Crier — federation visibility bus (REMOTE-004) ──────────────────────────
# Publishes tick-terminal and lane-state events to the scheduler's topic
# (sched.tick.<scheduler_id>) and subscribes to peer events. OFF by default:
# enabled=false is a pure no-op (no connection is ever opened), and a
# disabled or unreachable bus NEVER blocks or fails a tick — publishes are
# best-effort, failures are logged and dropped (the autonomy law).
# The token may also come from the CRIER_AUTH_TOKEN environment variable
# (env wins over this value; credentials never live in argv).
# [crier]
# url = "http://127.0.0.1:8767"
# token = ""                       # opt-in relay bearer (Crier CR_AUTH_TOKEN)
# enabled = false
# topics = ["sched.tick.>"]        # subscriber wildcard patterns
#
# Work dispatch (SCHED-GAP-1710). A LANE that declares an execution target in
# dispatch-targets.jsonl (env SCHEDULER_DISPATCH_TARGETS; default
# <home>/.hermes/coding-hermes/dispatch-targets.jsonl — a missing file means NO
# lane is remote) has its ticks HANDED to that named agent over the relay's
# durable per-agent inbox instead of running on the shared gateway. The answer
# comes back to the scheduler's OWN inbox, which therefore needs an identity on
# the relay (register it once with `crier keygen` + POST /agents):
#
#   CRIER_AGENT_ID        agent id whose inbox the scheduler reads
#   CRIER_AGENT_KEY_FILE  the PKCS#8 PEM key written for that agent id
#
# Without BOTH, a lane that declares a remote target REFUSES to dispatch — it
# never quietly falls back to the gateway. See docs/dispatch-spec.md §7.

# ── Federation — per-caller read policy (REMOTE-013) ────────────────────────
# Controls WHICH caller may read WHICH op of this scheduler's federation
# query surface (docs/federation-query-spec.md §4: reads are scoped, not
# open). Absent/commented = DENY-ALL: every federation read — HTTP, bus,
# MCP, CLI — is refused `op_not_allowed` until you publish ops. The key is
# the caller identity as it appears in the audit rows ("*" = the default
# every caller inherits; a specific caller's own row wins over "*").
# [federation.allow."*"]
# ops = ["fleet.status", "queue.get"]
# [federation.allow."primary-01"]
# ops = ["fleet.status"]

# ── Fleet — Declarative Project Definitions ─────────────────────────────────
# Projects are seeded at startup (create-only upsert — existing rows survive).
# Uncomment and edit the examples below for your fleet.

# [[projects]]
# name = "my-project"
# repo_url = "https://github.com/example/my-project"
# workdir = "/absolute/path/to/my-project"
# weight = 10
# priority = 5
# cooldown_s = 900
# decay_rate = 1.0
# model = "deepseek-v4-flash"
# provider = "deepseek-foreman"
# command = ""
# namespace_id = ""       # optional FK → namespaces.id
# deliver = "telegram:-1003310984808:12345"
# enabled = true

# ── Fleet — Declarative Namespace Definitions ────────────────────────────────
# Namespaces are seeded at startup (create-only upsert — existing rows survive).

# [[namespaces]]
# id = "coding-hermes"
# weight = 100
# reserved = 70
# hard_cap = 90
# description = "Coding Hermes fleet namespace"
# enabled = true

# [[namespaces]]
# id = "sandbox"
# weight = 20
# reserved = 0
# hard_cap = 50
# description = "Sandbox/test projects"
# enabled = true
