guards:
  secrets: true
  lint: false
  tests: false
  test_mode: full
  # The full suite is the whole module (the scheduler package alone runs ~115s at
  # idle). 180s was below that under fleet load — with judge jobs running, the
  # suite exceeds it and the hook blocks EVERY commit, code or not. 900s covers
  # the suite at load ~46 with room to spare.
  test_timeout: 900
  go:
    build: true
    lint: true
    tests: true
evaluator:
  max_iterations: 100
  max_time: "60m"
  max_input_tokens: "8M"
  max_output_tokens: "0.5M"
  tool_call_weight: 0.1
  static_analysis_diagnostics: false

pipeline:
  stages:
    - id: tier1
      parallel: true
      on: [pre-commit, pre-eval]
      steps:
        - id: guard
          type: script
          run: "gitreins guard"
          on_fail: block
    - id: tier2
      type: ai_eval
      on: [pre-eval]
      condition: "true"
      max_iterations: 200
      tools: [read_file, run_command, search_pattern, read_diff, sandbox, detect_dead_code]

defaults:
  model: deepseek-v4-flash
  max_iterations: 50
  check_for_updates: true
  update_check_ttl: "24h"
history:
  enabled: true
  storage: git
  max_verdicts: 1000
