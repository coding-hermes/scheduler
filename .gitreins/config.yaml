guards:
  allow_skips: true
  secrets: true
  lint: false
  tests: false
  test_mode: full
  # The full suite is the whole module (the scheduler package alone runs ~115s at
  # idle). 180s was below that under fleet load, and 900s itself was measured
  # exceeded at load ~35 (2026-11-09: module battery 634s wall clean at load 28,
  # but two guard runs hit the 900s cap at load 30-36 while the fleet ran worker
  # batteries). 1800s = ~3x the measured wall at current fleet load.
  test_timeout: 1800
  go:
    build: true
    lint: true
    tests: true
evaluator:
  max_iterations: 100
  max_time: "120m"
  max_input_tokens: "8M"
  max_output_tokens: "0.5M"
  tool_call_weight: 0.1
  static_analysis_diagnostics: false

pipeline:
  stages:
    - id: tier1
      parallel: true
      on: [pre-commit, pre-eval]
      steps:
        - id: guard
          type: script
          run: "gitreins guard"
          on_fail: block
    - id: tier2
      type: ai_eval
      on: [pre-eval]
      condition: "true"
      max_iterations: 200
      tools: [read_file, run_command, search_pattern, read_diff, sandbox, detect_dead_code]

defaults:
  model: deepseek-v4-flash
  max_iterations: 50
  check_for_updates: true
  update_check_ttl: "24h"
history:
  enabled: true
  storage: git
  max_verdicts: 1000
