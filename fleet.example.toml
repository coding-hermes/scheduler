# Fleet configuration — declarative project and namespace definitions
# Usage: schedulerd --config fleet.toml
#
# This file seeds the SQLite database with project and namespace definitions
# at startup. Existing rows are preserved (idempotent; create-only, never
# overwrites). Fields match the `projects` and `namespaces` tables in
# scheduler.db.

# ── Projects ────────────────────────────────────────────────────────────

[[projects]]
name = "my-project"                       # unique project identifier
repo_url = "https://github.com/user/my-project"
workdir = "/absolute/path/to/my-project"   # absolute path to project repo
weight = 10                               # concurrency budget consumed per tick (1-100)
priority = 5                              # scheduling priority (1=slowest, 10=fastest)
cooldown_s = 7200                          # tier: 900 hot (operator) / 7200 default 2h / 43200 idle 12h (only NEVER-DONE pending)
model = "deepseek-v4-flash"                 # LLM model for foreman ticks (chain tier 1 — project primary)
provider = "deepseek-foreman"             # provider (PAYG only for foremen) (chain tier 1 — project primary)
fallback_model = "deepseek-v4-pro"        # optional: fallback model tier (chain tier 2) — used when the primary model/provider is empty or rejected by the gateway
fallback_provider = "deepseek-foreman"    # optional: fallback provider tier (chain tier 2)
no_global_fallback = false                # true = STOP the chain here: never fall back to the spawner-level env defaults (SCHEDULER_FOREMAN_MODEL/_PROVIDER/_FALLBACK_*)
#model_chain = ["deepseek-v4-flash@deepseek-foreman", "deepseek-v4-pro@deepseek-foreman"]  # optional (SCHED-GAP-075): full ordered chain as "model@provider" hops — REPLACES the model/provider + fallback_* fields above as the project tier when set. Hops are tried left-to-right (first non-empty model and provider win per field)
#prompt = "Extra standing instructions appended to every tick prompt."  # optional (Bane 2026-08-27): extra foreman prompt text; APPENDED to the namespace default_prompt unless prompt_mode="replace"
#prompt_mode = "append"                   # "append" (default) | "replace" — replace swaps the namespace default_prompt out entirely (the scheduler always adds its tick-id prefix and workdir/worker-model footer on top)
idle_model = "deepseek-v4-flash"          # optional (SCHED-GAP-065): idle-tick chain tier — used when the project board has ZERO pending tasks; falls through to the regular chain when empty
idle_provider = "opencode-go"             # optional: idle-tick provider tier (empty = no project idle lane). Spawner-level env default: SCHEDULER_FOREMAN_IDLE_MODEL/_PROVIDER (the global idle lane, gated by no_global_fallback like the other global tiers)
daily_budget_usd = 5.0                    # optional (SCHED-GAP-066): per-UTC-day spend cap from ticks.cost_usd; omit or 0 = unlimited. Blocks NEW spawns only — a running tick always finishes
weekly_budget_usd = 20.0                  # optional: per-UTC-week cap (resets Monday 00:00 UTC); omit or 0 = unlimited
final_budget_usd = 0                      # optional: one-time lifetime cap, NEVER resets — exhausted = project stops scheduling for good (e.g. one-time projects)
namespace_id = "coding-hermes"            # DuckBrain namespace for context
deliver = "telegram:-1003310984808:12345" # platform:chat_id:thread_id for delivery
enabled = true                            # false = excluded from scheduling
# ── Adaptive cooldown (auto slow-down / speed-up) — OPT-IN ───────────────
# adaptive_cooldown = true                 # arm the no-progress escalator (absent key = off, unchanged legacy behavior)
# cooldown_floor_s = 7200                  # base cooldown reset target on ANY progress; 0/absent = the cooldown_s in force when enabled
# cooldown_ceiling_s = 345600              # escalation cap; absent/0 = DERIVED 8 × floor (ADV-R10 — same shape as the fleet pins; e.g. floor 43200 → 345600). Explicit value always wins.
# no_progress_threshold = 10               # consecutive no-progress ticks (0 commits AND no new tasks.jsonl rows) before cooldown_s doubles per tick; 0/absent = 10

# ── Namespaces ──────────────────────────────────────────────────────────

[[namespaces]]
id = "coding-hermes"                      # matches namespace_id in projects above
weight = 50                               # total weight budget ceiling for this namespace
reserved = 5                              # guaranteed slots (always allocated)
hard_cap = 80                             # absolute ceiling, never exceeded
description = "Core coding-hermes fleet namespace"
enabled = true                            # false = entire namespace paused
# ── Foreman prompt + model routing (Bane 2026-08-27) ────────────────────
#default_prompt = "You are the foreman for this namespace."  # base foreman prompt for EVERY project here; empty/absent = built-in prompt. A project prompt appends to it (or replaces it per prompt_mode). Re-pinned from this file on every boot when set
#model_chain = ["kimi-k3@kimi-for-coding", "deepseek-v4-flash@deepseek-foreman"]  # namespace chain tier: "model@provider" hops appended AFTER the project chain, BEFORE the router/global defaults. Applied when the namespace is CREATED from this file; for an existing namespace edit via PUT /api/v1/namespaces/{id}
#max_concurrent = 1                       # max ticks running at once in this namespace; 0/absent = unlimited (the global --max-concurrent still applies). Serialized lanes set 1 (e.g. duckbrain-sync). Positive values re-pin on every boot; a 0/absent entry leaves the live cap untouched
# ── S12 concurrent wave scheduling (optional, default-off) ─────────────
# wave_enabled = true                     # false/absent = waves off; scheduling byte-identical to pre-v27
# wave_tick_timeout = "3h"                # duration; ""/absent = inherit scheduler tick_timeout (recommended 3h = 1.5x base; HARD CEILING 4h — larger values are rejected at config validation, never clamped; S12 §4.3). Env override at spawn: SCHEDULER_WAVE_TICK_TIMEOUT
# wave_workers_cap = 3                    # max concurrent worker processes across running ticks in this namespace; 0/absent = unlimited
